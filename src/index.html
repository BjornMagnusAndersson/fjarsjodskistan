<title>Fjársjóðskistan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap">
<style>/*CSS*/</style>
<svg id="defs" aria-hidden="true"><defs></defs></svg>
<div id="stage">
  <div class="scene" id="scene"></div>
  <div id="critters"></div>
  <div class="doll" id="doll"></div>
  <div id="loose"></div>
  <div class="bar top-left" id="scenes" role="group" aria-label="Staðir"></div>
  <div class="bar left-low">
    <button class="btn" id="btnSave" aria-label="Vista föt"></button>
    <button class="btn" id="btnGallery" aria-label="Vistuð föt"></button>
    <button class="btn" id="btnUndress" aria-label="Fara úr öllu"></button>
    <button class="btn" id="btnTidy" aria-label="Taka til"></button>
    <div class="pair" role="group" aria-label="Til baka og áfram">
      <button class="btn small" id="btnBack" aria-label="Til baka" disabled></button>
      <button class="btn small" id="btnForward" aria-label="Áfram" disabled></button>
    </div>
    <button class="btn" id="btnGear" aria-label="Stillingar (haltu inni)"></button>
  </div>
  <div class="tray" id="tray" hidden>
    <div class="tabs" id="tabs" role="tablist" aria-label="Flokkar"></div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="chest" id="chest" role="button" aria-label="Fjársjóðskistan"></div>
  <div class="gallery" id="gallery" hidden></div>
  <div class="gallery friends" id="friends" hidden></div>
  <div class="menu" id="menu" hidden>
    <h2>Stillingar</h2>
    <label>Hljóð <input type="checkbox" id="optSound"></label>
    <label>Hljóðstyrkur <input type="range" id="optVolume" min="10" max="100" step="10"></label>
    <label>Dýrahljóð <input type="checkbox" id="optAnimals"></label>
    <label>Titringur <input type="checkbox" id="optVibrate"></label>
    <label>Styrkur titrings <input type="range" id="optVibStrength" min="1" max="3" step="1"></label>
    <p id="vibMsg"></p>
    <label>Róleg stilling (ekkert hreyfist) <input type="checkbox" id="optCalm"></label>
    <label>Hjartakrukka og vinir <input type="checkbox" id="optRewards"></label>
    <div class="row"><button id="menuFull">Allur skjár</button><button id="menuClose">Loka</button><button class="danger" id="menuReset">Eyða öllu</button></div>
    <p id="fullMsg" hidden>Vafrinn leyfir ekki allan skjá hér.</p>
    <div class="row"><button id="menuExport">Vista afrit</button><button id="menuImport">Opna afrit</button></div>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
    <p>Myndir af dúkkunni eins og hún er klædd núna:</p>
    <div class="row"><button id="menuPrint">Prenta litamynd</button><button id="menuColouring">Vista litamynd</button><button id="menuPhoto">Vista mynd í lit</button></div>
    <p id="picMsg" hidden></p>
    <p id="backupWhen"></p>
    <p id="backupMsg" hidden></p>
    <p id="storeMsg">Allt er vistað á þessu tæki. Taktu afrit af og til.</p>
    <details id="errBox"><summary id="errSum">Villukóðar</summary>
      <pre id="errLog"></pre>
      <div class="row"><button id="errCopy">Afrita</button><button id="errClear">Hreinsa</button></div>
      <p id="errMsg" hidden></p>
    </details>
  </div>
</div>
<div id="printPage" aria-hidden="true"></div>
<script>/*JS*/</script>
