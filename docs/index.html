    thumb: [110, 6, 180, 120],
    draw(it) {
      const [metal, mc, mc2 = mc] = it.colors;
      const band = H.polyPath(G.headArc(212, 328, 9, 24).concat(G.headArc(328, 212, 1, 24)));
      const spots = [[226, 8], [248, 11], [270, 16], [292, 11], [314, 8]];
      /** One motif centred on (x,y) with radius r; i alternates colours. */
      const motif = (x, y, r, i) => {
        const c = i % 2 ? mc2 : mc;
        if (it.motif === 'flake') return flakeO(x, y, r, c, r > 12 ? 3 : 2.4) + `<circle cx="${n1(x)}" cy="${n1(y)}" r="${n1(r * .25)}" fill="${H.grad(mc2, 'r')}" stroke="${ink(mc2)}" stroke-width="1"/>`;
        if (it.motif === 'berry') return strawberry(x, y, r);
        if (it.motif === 'heart') return `<path d="${heartD(x, y, r * .9)}" fill="${H.grad(c, 'r')}" stroke="${ink(c)}" stroke-width="1.5"/>`;
        return starO(x, y, r, c, 1.6) + `<path d="M${n1(x - r * .3)},${n1(y - r * .2)} l${n1(r * .2)},${n1(-r * .3)}" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>`;
      };
      // little stems joining each motif to the band
      const stems = spots.map(([a, r]) => { const [x0, y0] = at(a, 8), [x1, y1] = at(a, 9 + r * .6); return `M${P([x0, y0])}L${P([x1, y1])}`; }).join('');
      return `<path d="${stems}" stroke="${ink(metal)}" stroke-width="5" stroke-linecap="round"/><path d="${stems}" stroke="${metal}" stroke-width="3" stroke-linecap="round"/>` +
        spots.map(([a, r], i) => { const [x, y] = at(a, 9 + r); return motif(x, y, r, i); }).join('') +
        `<path d="${band}" fill="${H.grad(metal)}"/><path d="${band}" fill="url(#shine)" opacity=".5"/>` + outline(band, metal, 'v', 2) +
        G.headArc(222, 318, 5, 8).map(([x, y], i) => i % 2 ? '' : `<circle cx="${n1(x)}" cy="${n1(y)}" r="2.2" fill="#fff" opacity=".85"/>`).join('');
    },
  });

  /* -------------------------------------------------------------
     Flower wreath: leaves and Icelandic wildflowers along the head.
     holtasóley (white, 8 petals), gleym-mér-ei (small blue), lambagras
     (pink), fífill (yellow, many petals), blóðberg (purple cluster).
     colors: [leaf green, ...flower order keys are in it.flowers]
     ------------------------------------------------------------- */
  const WILD = {
    /** Mountain avens: white with eight petals and a yellow centre. */
    holtasoley: (x, y, r) => bloom(x, y, r, '#fbfaf4', '#f2c43c', 8, -90),
    /** Forget-me-not: small sky blue flowers in a little bunch. */
    gleymmerei: (x, y, r) => bloom(x - r * .45, y + r * .2, r * .6, '#7fb8ec', '#f7e27a') + bloom(x + r * .45, y - r * .1, r * .6, '#6aa8e6', '#f7e27a') + bloom(x, y - r * .45, r * .55, '#93c6f2', '#f7e27a'),
    /** Moss campion: bright pink five-petal flower. */
    lambagras: (x, y, r) => bloom(x, y, r * .85, '#f37fb0', '#fbe0ea'),
    /** Dandelion: yellow with many thin petals. */
    fifill: (x, y, r) => {
      let s = '';
      for (let i = 0; i < 16; i++) { const [px, py] = pol(x, y, r, i * 22.5); s += `M${n1(x)},${n1(y)}L${n1(px)},${n1(py)}`; }
      return `<path d="${s}" stroke="${ink('#f6c93a')}" stroke-width="4.6" stroke-linecap="round"/><path d="${s}" stroke="#f8d24a" stroke-width="3" stroke-linecap="round"/><circle cx="${n1(x)}" cy="${n1(y)}" r="${n1(r * .4)}" fill="#f3b52a"/>`;
    },
    /** Wild thyme: purple cluster of tiny dots. */
    blodberg: (x, y, r) => [[0, 0], [-.45, .25], [.45, .25], [-.25, -.4], [.25, -.4], [0, .55]].map(([a, b]) => `<circle cx="${n1(x + a * r)}" cy="${n1(y + b * r)}" r="${n1(r * .33)}" fill="${H.grad('#b46ad0', 'r')}" stroke="${ink('#b46ad0')}" stroke-width=".9"/>`).join(''),
  };
  DOLL.shape('head-wreath', {
    slot: 'hat',
    thumb: [104, 30, 192, 126],
    draw(it) {
      const leafC = it.colors[0];
      const arc = G.headArc(200, 340, 4, 28);
      // vine under the flowers
      let s = `<path d="M${arc.map(P).join('L')}" fill="none" stroke="${ink(leafC)}" stroke-width="5" stroke-linecap="round"/><path d="M${arc.map(P).join('L')}" fill="none" stroke="${shade(leafC, -.1)}" stroke-width="3" stroke-linecap="round"/>`;
      // leaves pointing outward and inward along the vine
      for (let i = 1; i < arc.length; i += 2) {
        const a = 200 + 140 * i / 28, [x, y] = arc[i];
        s += leaf(x, y, 13, a + (i % 4 === 1 ? -50 : 50), i % 4 === 1 ? leafC : shade(leafC, .15));
      }
      // flowers along the vine in the item's order (biggest near the top)
      const kinds = it.flowers, nF = 9;
      for (let k = 0; k < nF; k++) {
        const a = 206 + 128 * k / (nF - 1), r = 10 - Math.abs(k - 4) * .5;
        const [x, y] = at(a, 6);
        s += WILD[kinds[k % kinds.length]](x, y, r);
      }
      return s;
    },
  });

  /* =====================================================================
     HAIRBANDS AND CLIPS (slot hairband). The band follows the head arc
     on top of the hair and ends just above the ears.
     ===================================================================== */

  /** Bow with two loops, a knot and two tails; centred at (cx,cy), s = scale, rot in degrees. */
  const bow = (cx, cy, s, col, rot = 0, fill) => {
    const f = fill || H.grad(col), sw = n1(2 / s), k = ink(col);
    const loopL = 'M-2,0 C-10,-16 -28,-18 -28,-3 C-28,11 -12,12 -2,0 Z';
    const tailL = 'M-3,3 Q-9,16 -15,27 L-8,26 L-5,32 Q-1,18 2,4 Z';
    const fold = 'M-6,-2 Q-15,-8 -22,-5 M-6,2 Q-14,6 -21,4';
    const half = (m) => `<g transform="scale(${m},1)"><path d="${tailL}" fill="${f}" stroke="${k}" stroke-width="${sw}" stroke-linejoin="round"/>` +
      `<path d="${loopL}" fill="${f}" stroke="${k}" stroke-width="${sw}" stroke-linejoin="round"/><path d="${loopL}" fill="url(#soft-r)"/>` +
      `<path d="${fold}" stroke="${k}" stroke-width="${n1(1.3 / s)}" fill="none" opacity=".5" stroke-linecap="round"/></g>`;
    return `<g transform="translate(${n1(cx)},${n1(cy)}) rotate(${rot}) scale(${s})">` + half(1) + half(-1) +
      `<ellipse cx="0" cy="0" rx="6" ry="7" fill="${H.grad(shade(col, -.06), 'r')}" stroke="${k}" stroke-width="${sw}"/>` +
      `<path d="M-14,-9 q4,-4 9,-3" stroke="#fff" stroke-width="${n1(2 / s)}" fill="none" stroke-linecap="round" opacity=".6"/></g>`;
  };
  /** Butterfly centred at (cx,cy), s = scale; colors: wings, wing spots. */
  const butterfly = (cx, cy, s, col, spot, rot = 0) => {
    const k = ink(col), sw = n1(1.6 / s);
    const up = 'M0,-1 C-5,-15 -21,-18 -20,-6 C-19,1 -9,2 0,-1 Z', lo = 'M0,1 C-5,3 -16,6 -13,14 C-10,19 -3,10 0,1 Z';
    const half = m => `<g transform="scale(${m},1)"><path d="${up}" fill="${H.grad(col, 'r')}" stroke="${k}" stroke-width="${sw}"/><path d="${lo}" fill="${H.grad(shade(col, .15), 'r')}" stroke="${k}" stroke-width="${sw}"/>` +
      `<circle cx="-12" cy="-7" r="3.2" fill="${spot}"/><circle cx="-8" cy="8" r="2.2" fill="${spot}"/></g>`;
    return `<g transform="translate(${n1(cx)},${n1(cy)}) rotate(${rot}) scale(${s})">` + half(1) + half(-1) +
      `<path d="M-1,-8 q-3,-7 -7,-9 M1,-8 q3,-7 7,-9" stroke="${k}" stroke-width="${sw}" fill="none" stroke-linecap="round"/>` +
      `<ellipse cx="0" cy="1" rx="2.4" ry="9" fill="${k}"/></g>`;
  };

  /* -------------------------------------------------------------
     Hairband: a band along the head arc, plus an optional topper:
     'bow' (big bow on the side), 'flowers', 'cat' ears, 'bunny' ears,
     'unicorn' horn with ears, 'knot' (knotted top) or 'gems'.
     colors: [band, band motif / second colour, topper, topper detail]
     ------------------------------------------------------------- */
  DOLL.shape('head-band', {
    slot: 'hairband',
    draw(it) {
      const [c, c2 = '#ffffff', tc = c, td = '#ffffff'] = it.colors;
      const arc = G.headArc(197, 343, 3, 30), mid = 'M' + arc.map(P).join('L');
      const w = it.wide ? 13 : 9;
      const fill = it.pattern ? H.pat(it.pattern, c, c2, it.patternSize || 12) : H.grad(c);
      let out = '';
      const top = it.top;
      // things standing behind the band (ears, horn) are drawn first
      if (top === 'cat') {
        const ear = a => { const b1 = at(a - 11, 4), b2 = at(a + 11, 4), tip = at(a, 34), i1 = at(a - 6, 8), i2 = at(a + 6, 8), it2 = at(a, 26);
          return `<path d="M${P(b1)}Q${P(at(a - 6, 24))} ${P(tip)}Q${P(at(a + 6, 24))} ${P(b2)}Z" fill="${H.grad(tc)}" stroke="${ink(tc)}" stroke-width="2.2" stroke-linejoin="round"/>` +
            `<path d="M${P(i1)}Q${P(at(a - 3, 20))} ${P(it2)}Q${P(at(a + 3, 20))} ${P(i2)}Z" fill="${td}" opacity=".9"/>`; };
        out += ear(232) + ear(308);
      } else if (top === 'bunny') {
        /** Long upright bunny ear at head angle a, leaning by lean degrees. */
        const ear = (a, lean) => { const [bx, by] = at(a, 4);
          return `<g transform="translate(${n1(bx)},${n1(by)}) rotate(${lean})"><path d="M-9,4 C-14,-30 -10,-62 0,-66 C10,-62 14,-30 9,4 Z" fill="${H.grad(tc)}" stroke="${ink(tc)}" stroke-width="2.2"/>` +
            `<path d="M-4,0 C-7,-26 -5,-50 0,-56 C5,-50 7,-26 4,0 Z" fill="${td}" opacity=".85"/><path d="M-9,4 C-14,-30 -10,-62 0,-66 C10,-62 14,-30 9,4 Z" fill="url(#soft-h)"/></g>`; };
        out += ear(250, -14) + ear(290, 14);
      } else if (top === 'unicorn') {
        const [hx, hy] = at(270, 4);
        const horn = `M${n1(hx - 10)},${n1(hy + 2)} L${n1(hx - 1.5)},${n1(hy - 44)} Q${n1(hx)},${n1(hy - 47)} ${n1(hx + 1.5)},${n1(hy - 44)} L${n1(hx + 10)},${n1(hy + 2)} Z`;
        const hclip = H.clip('c-' + it.id + '-horn', horn);
        const spiral = [-6, -16, -26, -36].map(dy => `M${n1(hx - 12)},${n1(hy + dy + 4)} L${n1(hx + 12)},${n1(hy + dy - 4)}`).join('');
        const ear = a => { const b1 = at(a - 7, 4), b2 = at(a + 7, 4), tip = at(a - (a < 270 ? 4 : -4), 24);
          return `<path d="M${P(b1)}Q${P(at(a - 4, 18))} ${P(tip)}Q${P(at(a + 4, 18))} ${P(b2)}Z" fill="${H.grad(c)}" stroke="${ink(c)}" stroke-width="2" stroke-linejoin="round"/>`; };
        out += ear(240) + ear(300) +
          `<path d="${horn}" fill="${H.grad(tc)}"/><g clip-path="${hclip}"><path d="${spiral}" stroke="${td}" stroke-width="3" fill="none"/></g>` + outline(horn, tc, 'h', 2);
      }
      // the band itself: ink edge, fill, a highlight line
      out += `<path d="${mid}" fill="none" stroke="${ink(c)}" stroke-width="${w + 2.6}" stroke-linecap="round" stroke-linejoin="round"/>` +
        `<path d="${mid}" fill="none" stroke="${fill}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>` +
        `<path d="M${G.headArc(214, 326, 3 + w * .28, 20).map(P).join('L')}" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".5"/>`;
      if (top === 'bow') {
        const [x, y] = at(236, 6);
        out += bow(x, y, it.bowSize || 1.05, tc, -32, it.bowPattern ? H.pat(it.bowPattern, tc, td, 10) : null);
      } else if (top === 'flowers') {
        out += leaf(...at(236, 4), 14, 160) + leaf(...at(254, 6), 14, 300) +
          [[226, 9], [242, 12], [258, 9]].map(([a, r], i) => { const [x, y] = at(a, 5); return bloom(x, y, r, [tc, td, tc][i]); }).join('');
      } else if (top === 'unicorn') {
        out += bloom(...at(252, 6), 9, '#f7a6c2') + bloom(...at(288, 6), 9, '#b9a8f2') + leaf(...at(260, 5), 10, 320) + leaf(...at(280, 5), 10, 220);
      } else if (top === 'knot') {
        // knotted top: a puffy twist in the middle of a wide band
        const [x, y] = at(270, 3);
        out += `<path d="M${x - 14},${y - 6} C${x - 10},${y - 18} ${x + 10},${y - 18} ${x + 14},${y - 6} C${x + 10},${y + 8} ${x - 10},${y + 8} ${x - 14},${y - 6} Z" fill="${fill}" stroke="${ink(c)}" stroke-width="2.2"/>` +
          `<path d="M${x - 14},${y - 6} C${x - 10},${y - 18} ${x + 10},${y - 18} ${x + 14},${y - 6} C${x + 10},${y + 8} ${x - 10},${y + 8} ${x - 14},${y - 6} Z" fill="url(#soft-r)"/>` +
          H.line(`M${x - 8},${y - 10} Q${x},${y - 2} ${x + 8},${y + 2} M${x - 9},${y + 1} Q${x},${y - 4} ${x + 7},${y - 11}`, c, 1.6, .5);
      } else if (top === 'gems') {
        out += G.headArc(222, 318, 3, 8).map(([x, y], i) => i % 2 ? `<circle cx="${n1(x)}" cy="${n1(y)}" r="3" fill="${H.grad(td, 'r')}" stroke="${ink(td)}" stroke-width="1"/>` : H.diamond(x, y, 5.5, tc)).join('');
      }
      return out;
    },
  });

  /* -------------------------------------------------------------
     Hair clips: a pair of clips on each side of the head (left side
     computed, right side mirrored). it.kind = 'flower' | 'butterfly' | 'star' | 'heart'.
     colors: [main, second, clip bar]
     ------------------------------------------------------------- */
  DOLL.shape('head-clips', {
    slot: 'hairband',
    thumb: [116, 70, 72, 72],
    draw(it) {
      const [c, c2, bar = '#e9eef3'] = it.colors;
      /** One clip at head angle a, size r. */
      const clip = (a, r, i) => {
        const [x, y] = at(a, -6), rot = a - 270;
        const col = i % 2 ? c2 : c;
        const barD = `<g transform="rotate(${n1(rot + 90)} ${n1(x)} ${n1(y)})"><rect x="${n1(x - 2.5)}" y="${n1(y - r * 1.4)}" width="5" height="${n1(r * 2.8)}" rx="2.5" fill="${H.grad(bar)}" stroke="${ink(bar)}" stroke-width="1.2"/></g>`;
        let m;
        if (it.kind === 'butterfly') m = butterfly(x, y, r / 13, col, i % 2 ? c : c2, rot + 20);
        else if (it.kind === 'star') m = starO(x, y, r, col, 1.6) + `<path d="M${n1(x - r * .3)},${n1(y - r * .25)} l${n1(r * .2)},${n1(-r * .28)}" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>`;
        else if (it.kind === 'heart') m = `<path d="${heartD(x, y, r * .9)}" fill="${H.grad(col, 'r')}" stroke="${ink(col)}" stroke-width="1.5"/>` + `<path d="M${n1(x - r * .55)},${n1(y - r * .2)} q2,-4 5,-4" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
        else m = bloom(x, y, r, col, i % 2 ? '#ffd84d' : c2);
        return barD + m;
      };
      const side = clip(214, it.kind === 'butterfly' ? 12 : 10, 0) + clip(233, it.kind === 'butterfly' ? 13 : 11, 1);
      return side + mirror(side);
    },
  });

  /* -------------------------------------------------------------
     Big bow on its own, clipped to the upper right of the head
     (above the ponytail tie when the ponytail is worn).
     colors: [bow, pattern colour]; it.pattern optional
     ------------------------------------------------------------- */
  DOLL.shape('head-bigbow', {
    slot: 'hairband',
    thumb: [196, 30, 120, 92],
    draw(it) {
      const [c, c2 = '#ffffff'] = it.colors;
      const [x, y] = at(302, 8);
      return bow(x, y, 1.45, c, 28, it.pattern ? H.pat(it.pattern, c, c2, 12) : null);
    },
  });

  /* =====================================================================
     GLASSES (slot glasses). Lenses are centred on G.eyes and see-through
     (tint with low opacity) so the eyes still show. The left half is drawn
     and mirrored; the bridge and lens shines are drawn once.
     ===================================================================== */

  /** Lens outline for the LEFT eye at (cx,cy), by kind. */
  const lensPath = (kind, cx, cy) => {
    if (kind === 'cateye') return H.smooth([[cx + 19, cy - 9], [cx + 8, cy - 17], [cx - 10, cy - 18], [cx - 25, cy - 23], [cx - 22, cy - 6], [cx - 14, cy + 14], [cx + 2, cy + 20], [cx + 16, cy + 13]]);
    if (kind === 'aviator') return H.smooth([[cx + 19, cy - 13], [cx, cy - 17], [cx - 19, cy - 15], [cx - 23, cy - 2], [cx - 16, cy + 15], [cx - 1, cy + 22], [cx + 14, cy + 15], [cx + 20, cy + 1]]);
    if (kind === 'star') {
      const pts = [];
      for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 16 : 28; pts.push([cx + Math.cos(a) * r, cy + 3 + Math.sin(a) * r]); }
      return H.polyPath(pts);
    }
    if (kind === 'flower') {
      const pts = [];
      for (let i = 0; i < 48; i++) { const a = i / 48 * Math.PI * 2, r = 21.5 + 3.5 * Math.cos(6 * a + Math.PI); pts.push([cx + Math.cos(a) * r, cy + 1 + Math.sin(a) * r]); }
      return H.smooth(pts);
    }
    if (kind === 'square') return `M${cx - 13},${cy - 15} H${cx + 13} Q${cx + 22},${cy - 15} ${cx + 22},${cy - 6} V${cy + 8} Q${cx + 22},${cy + 17} ${cx + 13},${cy + 17} H${cx - 13} Q${cx - 22},${cy + 17} ${cx - 22},${cy + 8} V${cy - 6} Q${cx - 22},${cy - 15} ${cx - 13},${cy - 15} Z`;
    // round
    return `M${cx - 21},${cy + 1}a21,21 0 1 0 42,0a21,21 0 1 0 -42,0Z`;
  };

  DOLL.shape('head-specs', {
    slot: 'glasses',
    draw(it) {
      const [frame, lens = '#ffffff', deco] = it.colors;
      const kind = it.kind || 'round', [lx, ly] = G.eyes[0];
      const d = lensPath(kind, lx, ly);
      const op = it.tint ?? .3;
      const fw = it.thin ? 2.6 : 4.2;
      // temple arm from the lens's outer edge back to the ear
      const temple = `M${lx - 20},${ly - 6} L128,${ly - 8}`;
      let frameMarkup;
      if (kind === 'rainbow') {
        const cols = ['#ef6f6c', '#f6a65a', '#f7d660', '#7fcf8a', '#6fb3e6', '#a58be0'];
        frameMarkup = `<path d="M${lx - 25},${ly + 1}a25,25 0 1 0 50,0a25,25 0 1 0 -50,0Z M${lx - 17},${ly + 1}a17,17 0 1 0 34,0a17,17 0 1 0 -34,0Z" fill="none" stroke="${ink('#a58be0')}" stroke-width="1.6"/>` +
          cols.map((col, i) => `<circle cx="${lx}" cy="${ly + 1}" r="${n1(24 - i * 1.33)}" fill="none" stroke="${col}" stroke-width="1.6"/>`).join('');
      } else {
        frameMarkup = `<path d="${d}" fill="none" stroke="${ink(frame)}" stroke-width="${fw + 2.8}" stroke-linejoin="round"/>` +
          `<path d="${d}" fill="none" stroke="${frame}" stroke-width="${fw}" stroke-linejoin="round"/>`;
      }
      const armCol = kind === 'rainbow' ? '#a58be0' : frame;
      const half = `<path d="${temple}" stroke="${ink(armCol)}" stroke-width="${fw + 2.4}" stroke-linecap="round"/><path d="${temple}" stroke="${armCol}" stroke-width="${fw}" stroke-linecap="round"/>` +
        `<path d="${d}" fill="${lens}" opacity="${op}"/>` + frameMarkup +
        // little decorations on the outer top corner (cat-eye gems, dots)
        (deco ? [[-17, -16], [-10, -18], [-23, -19]].map(([a, b], i) => i < (kind === 'cateye' ? 3 : 0) ? `<circle cx="${lx + a}" cy="${ly + b + 1}" r="1.8" fill="${deco}" stroke="${ink(deco)}" stroke-width=".7"/>` : '').join('') : '');
      const bridgeD = kind === 'aviator' ? 'M191,152 Q200,148 209,152 M191,159 Q200,155 209,159' : (kind === 'star' ? 'M188,159 Q200,151 212,159' : 'M191,158 Q200,151 209,158');
      const bridge = `<path d="${bridgeD}" fill="none" stroke="${ink(armCol)}" stroke-width="${fw + 2.4}" stroke-linecap="round"/><path d="${bridgeD}" fill="none" stroke="${armCol}" stroke-width="${fw}" stroke-linecap="round"/>`;
      // white shine strokes on both lenses (same direction on both = one light source)
      const shine = G.eyes.map(([x, y]) => `<path d="M${x - 11},${y - 6} q3,-6 9,-7" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".75"/>`).join('');
      return half + mirror(half) + bridge + shine;
    },
  });

  /* -------------------------------------------------------------
     Goggles: 'ski' (one wide mirrored lens, padded frame, wide strap)
     or 'swim' (two small cups with a thin strap). Lenses stay see-through.
     colors: [frame, lens tint 1, lens tint 2, strap]
     ------------------------------------------------------------- */
  DOLL.shape('head-goggles', {
    slot: 'glasses',
    thumb: [100, 122, 200, 84],
    draw(it) {
      const [frame, t1, t2 = t1, strap = frame] = it.colors;
      const gid = 'gg-' + it.id;
      const lensFill = addGrad(gid, [[0, t1], [1, t2]]);
      if (it.kind === 'swim') {
        const cup = ([x, y]) => `M${x - 19},${y + 1}a19,16 0 1 0 38,0a19,16 0 1 0 -38,0Z`;
        const strapL = 'M154,160 L112,158';
        const sl = `<path d="${strapL}" stroke="${ink(strap)}" stroke-width="7.6" stroke-linecap="round"/><path d="${strapL}" stroke="${strap}" stroke-width="5" stroke-linecap="round"/>`;
        return sl + mirror(sl) +
          G.eyes.map(e => `<path d="${cup(e)}" fill="${lensFill}" opacity=".42"/>` +
            `<path d="${cup(e)}" fill="none" stroke="${ink(frame)}" stroke-width="7.6"/><path d="${cup(e)}" fill="none" stroke="${frame}" stroke-width="5"/>` +
            `<path d="M${e[0] - 12},${e[1] - 4} q3,-6 9,-7" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".8"/>`).join('') +

     ===================================================================== */
  const NA = [181, 246], NC1 = [181, 292], NC2 = [219, 292], NB = [219, 246];
  /** Point on the necklace curve, t 0..1 (cubic Bezier). */
  const neckPt = t => { const u = 1 - t, a = u * u * u, b = 3 * u * u * t, c = 3 * u * t * t, d = t * t * t;
    return [a * NA[0] + b * NC1[0] + c * NC2[0] + d * NB[0], a * NA[1] + b * NC1[1] + c * NC2[1] + d * NB[1]]; };
  /** n evenly-ish spaced points along the curve (re-sampled by length). */
  const neckPts = n => {
    const fine = Array.from({ length: 201 }, (_, i) => neckPt(i / 200)), len = [0];
    for (let i = 1; i < fine.length; i++) len.push(len[i - 1] + Math.hypot(fine[i][0] - fine[i - 1][0], fine[i][1] - fine[i - 1][1]));
    const total = len[len.length - 1], out = [];
    for (let k = 0; k < n; k++) { const L = total * k / (n - 1); let i = len.findIndex(v => v >= L); out.push(fine[Math.max(0, i)]); }
    return out;
  };
  const NECK_D = `M${NA.join(',')} C${NC1.join(',')} ${NC2.join(',')} ${NB.join(',')}`;

      } else if (kind === 'flake') {
        pend = flakeO(px, py + 2, 12, c, 2.6) + `<circle cx="${px}" cy="${py + 2}" r="3" fill="${H.grad(c2, 'r')}" stroke="${ink(c2)}" stroke-width="1"/>`;

          `<path d="M${px - 8},${py - 2} H${px + 8} M${px},${py - 10} L${px - 3},${py - 2} L${px},${py + 16} L${px + 3},${py - 2} Z" fill="none" stroke="#fff" stroke-width="1" opacity=".6"/>` +

   mirrored for the right side (x → 400 - x).

/* =====================================================================
   Dresses, capes/wings, swimwear and pyjamas.
   Princess dresses (cat 'dress'), everyday dresses (cat 'frock'),
   capes and wings (cat 'cape'), swimsuits (cat 'swim'), pyjamas (cat 'pyjamas').
   Everything draws in doll space (viewBox 0 0 400 800) with the G helpers.
   Drawing order inside a piece: fill → details → soft shading + outline.
   ===================================================================== */
(function () {
  'use strict';
  const { shade, ink, mix } = H;
  const SW = G.stroke;
  const OCC = ['dress', 'top', 'bottom'];
  const SUIT = ['suit', 'top', 'bottom'];

  /* -------------------------------------------------------------
     Shared toolkit
     ------------------------------------------------------------- */

  /** Round a number to one decimal for compact SVG. */
  const F = v => (Math.round(v * 10) / 10).toString();
  /** Point [x,y] → "x,y". */
  const P = p => F(p[0]) + ',' + F(p[1]);

  /** Final pass for a shape: soft shading overlay plus the tinted outline (same as examples.js). */
  const outline = (d, base, soft = 'v', sw = SW) =>
    `<path d="${d}" fill="url(#soft-${soft})" stroke="${ink(base)}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"/>`;

  /** Register a linear gradient with [offset, colour, opacity?] stops. dir 'v' (top→bottom) or 'h' (left→right). */
  const lg = (id, stops, dir = 'v') => H.def(id, `<linearGradient id="${id}" x1="0" y1="0" x2="${dir === 'h' ? 1 : 0}" y2="${dir === 'h' ? 0 : 1}">` +
    stops.map(([o, c, op]) => `<stop offset="${o}" stop-color="${c}"${op != null ? ` stop-opacity="${op}"` : ''}/>`).join('') + '</linearGradient>');

  /** A sparkle: four-pointed twinkle star. */
  const twinkle = (x, y, r, c = '#ffffff') =>
    `<path d="M${F(x)},${F(y - r)}Q${F(x)},${F(y)} ${F(x + r)},${F(y)}Q${F(x)},${F(y)} ${F(x)},${F(y + r)}Q${F(x)},${F(y)} ${F(x - r)},${F(y)}Q${F(x)},${F(y)} ${F(x)},${F(y - r)}Z" fill="${c}"/>`;
  /** Many twinkles from a [[x,y,r],...] list. */
  const twinkles = (list, c) => list.map(([x, y, r]) => twinkle(x, y, r, c)).join('');

  /**
   * Smooth skirt side edge (LEFT side of the picture) through [y, x] control points.
   * Returns a function x(y). The right side is always 400 - x(y), so skirts stay mirrored.
   * Keep x ≥ ~117 between y 440 and 486 so the skirt never covers the hands.
   */
  function edge(pts) {
    const dense = [];
    const cr = (a, b, c, d, t) => .5 * (2 * b + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t * t + (-a + 3 * b - 3 * c + d) * t * t * t);
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
      for (let s = 0; s < 8; s++) dense.push([cr(p0[0], p1[0], p2[0], p3[0], s / 8), cr(p0[1], p1[1], p2[1], p3[1], s / 8)]);
    }
    dense.push(pts[pts.length - 1]);
    return y => {
      if (y <= dense[0][0]) return dense[0][1];
      for (let i = 1; i < dense.length; i++) if (y <= dense[i][0]) {
        const [y0, x0] = dense[i - 1], [y1, x1] = dense[i];
        return x0 + (x1 - x0) * (y - y0) / ((y1 - y0) || 1);
      }
      return dense[dense.length - 1][1];
    };
  }

  /**
   * Hem from (x0, y) across to (400 - x0, y) as relative path commands.
   * type: scallop | icicle | petal (pointed) | round (round petal) | wave | zig | cloud | flat.
   * The number of segments is always odd so the hem is mirror-symmetric.
   */
  function hem(x0, type, step, amp) {
    const span = 400 - 2 * x0;
    let n = Math.max(3, Math.round(span / step)); if (n % 2 === 0) n++;
    const w = span / n, h = w / 2;
    let d = '';
    for (let i = 0; i < n; i++) {
      if (type === 'scallop') d += `q${F(h)},${F(amp)} ${F(w)},0`;
      else if (type === 'icicle') { const a = i % 2 ? amp * .6 : amp; d += `l${F(h)},${F(a)}l${F(h)},${F(-a)}`; }
      else if (type === 'petal') d += `c0,${F(amp * .5)} ${F(w * .3)},${F(amp * .85)} ${F(h)},${F(amp)}c${F(w * .2)},${F(-amp * .15)} ${F(h)},${F(-amp * .5)} ${F(h)},${F(-amp)}`;
      else if (type === 'round') d += `c0,${F(amp * .8)} ${F(w * .22)},${F(amp)} ${F(h)},${F(amp)}c${F(w * .28)},0 ${F(h)},${F(-amp * .2)} ${F(h)},${F(-amp)}`;
      else if (type === 'wave') d += `q${F(w / 4)},${F(amp)} ${F(h)},0q${F(w / 4)},${F(-amp * .55)} ${F(h)},0`;
      else if (type === 'zig') d += `l${F(h)},${F(amp)}l${F(h)},${F(-amp)}`;
      else if (type === 'cloud') d += `a${F(h)},${F(amp)} 0 0 0 ${F(w)},0`;
      else d += `h${F(w)}`;
    }
    return { d, n, w };
  }

  /**
   * One skirt tier from the waist (top) down to yEnd, using edge function xl.
   * pad pushes the tier slightly outward toward its hem (puffy top layers).
   * Returns { d (closed path), hemD (open hem line), x0, n, w, y, amp }.
   */
  function tier(xl, top, yEnd, type, step, amp, pad = 0) {
    const X = y => xl(y) - pad * Math.max(0, Math.min(1, (y - top) / Math.max(1, yEnd - top)));
    const ys = [];
    for (let y = top + 18; y < yEnd - 6; y += 18) ys.push(y);
    const x0 = X(yEnd), h = hem(x0, type, step, amp);
    const d = `M${F(X(top))},${top}` + ys.map(y => `L${F(X(y))},${y}`).join('') + `L${F(x0)},${yEnd}` + h.d +
      ys.slice().reverse().map(y => `L${F(400 - X(y))},${y}`).join('') + `L${F(400 - X(top))},${top}Z`;
    return { d, hemD: `M${F(x0)},${yEnd}` + h.d, x0, n: h.n, w: h.w, y: yEnd, amp };
  }
  /** Centre points of a tier's hem segments (petal tips / scallop bottoms). */
  const tips = (t, k = 1) => Array.from({ length: t.n }, (_, i) => [t.x0 + t.w * (i + .5), t.y + t.amp * k]);
  /** Points where two hem segments meet. */
  const joins = t => Array.from({ length: t.n - 1 }, (_, i) => [t.x0 + t.w * (i + 1), t.y]);

  /** Frosty/lacy line along a hem: wide light stroke plus a dotted stroke on top. */
  const hemTrim = (d, c1, c2, w = 6) =>
    `<path d="${d}" fill="none" stroke="${c1}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" opacity=".92"/>` +
    `<path d="${d}" fill="none" stroke="${c2}" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>`;

  /**
   * Point on an arm, offset sideways from the arm centreline.
   * off > 0 = toward the outside (away from the body). Mirrored correctly for 'R'.
   */
  function armN(side, t, off = 0) {
    const [x, y] = G.armPoint('L', t), [x2, y2] = G.armPoint('L', t + .01);
    const l = Math.hypot(x2 - x, y2 - y), nx = -(y2 - y) / l, ny = (x2 - x) / l;
    const px = x + nx * off, py = y + ny * off;
    return side === 'L' ? [px, py] : [400 - px, py];
  }
  /** Direction of the arm in degrees at t (for rotating motifs along the arm), mirrored for 'R'. */
  function armAng(side, t) {
    const [x, y] = G.armPoint('L', t), [x2, y2] = G.armPoint('L', t + .01);
    const a = Math.atan2(y2 - y, x2 - x) * 180 / Math.PI;
    return side === 'L' ? a : 180 - a;
  }
  /** Arm half-width (no padding) at t, same numbers as core's arm. */
  const armHW = t => t <= .5 ? 17 - 6 * t : 14 - 5 * (t - .5);

  /** Row of small balls across a sleeve end at arm t (fluffy or pearl trim), from inner to outer edge. */
  const cuffBalls = (side, t, half, r, fill, stroke, n = 5) => Array.from({ length: n }, (_, i) => {
    const p = armN(side, t, -half + 2 * half * i / (n - 1));
    return `<circle cx="${F(p[0])}" cy="${F(p[1])}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="1.2"/>`;
  }).join('');

  /** Gathering lines on a puff sleeve (from shoulder toward the cuff), both sides. */
  const gathers = (t0, t1, half, base) => ['L', 'R'].map(s => [-.5, 0, .5].map(k => {
    const a = armN(s, t0, k * half * .5), b = armN(s, t1, k * half * .85);
    return `M${P(a)}L${P(b)}`;
  }).join('')).join('');

  /** Points along a G.shirtPath neckline curve (round/high/scoop/boat), left to right. */
  function neckPts(neck, depth, pad, n) {
    const nw = { round: 17, high: 15, scoop: 25, boat: 34 }[neck];
    const ny = 252 - (neck === 'high' ? 8 : 0) - pad * .3, cy = ny + depth * 2;
    return Array.from({ length: n }, (_, i) => {
      const t = i / (n - 1), u = 1 - t;
      return [u * u * (200 - nw) + 2 * u * t * 200 + t * t * (200 + nw), u * u * ny + 2 * u * t * cy + t * t * ny];
    });
  }

  /** Waist belt band across the dress at y (height h), from waist edge to waist edge. */
  const belt = (y, h, fill, base, x = G.torsoX(y + h / 2) - 3) =>
    `<rect x="${F(x)}" y="${y}" width="${F(400 - 2 * x)}" height="${h}" rx="${F(h / 3)}" fill="${fill}" stroke="${ink(base)}" stroke-width="2"/>`;

  /** Ribbon bow centred at (x,y), size s. */
  const bow = (x, y, s, c) =>
    `<path d="M${x},${y} C${F(x - s * .6)},${F(y - s * .9)} ${F(x - s * 1.25)},${F(y - s * .5)} ${F(x - s * 1.1)},${F(y + s * .1)} C${F(x - s * 1)},${F(y + s * .6)} ${F(x - s * .5)},${F(y + s * .45)} ${x},${y}Z` +
    `M${x},${y} C${F(x + s * .6)},${F(y - s * .9)} ${F(x + s * 1.25)},${F(y - s * .5)} ${F(x + s * 1.1)},${F(y + s * .1)} C${F(x + s * 1)},${F(y + s * .6)} ${F(x + s * .5)},${F(y + s * .45)} ${x},${y}Z" fill="${H.grad(c)}" stroke="${ink(c)}" stroke-width="1.6" stroke-linejoin="round"/>` +
    `<path d="M${F(x - s * .15)},${F(y + s * .1)} L${F(x - s * .5)},${F(y + s * 1.1)} L${F(x - s * .2)},${F(y + s)} M${F(x + s * .15)},${F(y + s * .1)} L${F(x + s * .5)},${F(y + s * 1.1)} L${F(x + s * .2)},${F(y + s)}" fill="none" stroke="${shade(c, -.1)}" stroke-width="${F(s * .28)}" stroke-linecap="round" stroke-linejoin="round"/>` +
    `<ellipse cx="${x}" cy="${y}" rx="${F(s * .28)}" ry="${F(s * .32)}" fill="${shade(c, .1)}" stroke="${ink(c)}" stroke-width="1.4"/>`;

  /* ---- small motifs ---- */

  /** Rose bloom: round flower with a spiral of darker petal lines. */
  const rose = (x, y, r, c) =>
    `<circle cx="${F(x)}" cy="${F(y)}" r="${F(r)}" fill="${H.grad(c, 'r')}" stroke="${ink(c)}" stroke-width="1.3"/>` +
    `<path d="M${F(x - r * .62)},${F(y + r * .1)} Q${F(x - r * .5)},${F(y + r * .72)} ${F(x + r * .1)},${F(y + r * .62)} M${F(x + r * .66)},${F(y - r * .05)} Q${F(x + r * .5)},${F(y - r * .7)} ${F(x - r * .2)},${F(y - r * .6)} ` +
    `M${F(x - r * .3)},${F(y + r * .05)} Q${F(x - r * .2)},${F(y + r * .38)} ${F(x + r * .18)},${F(y + r * .28)} Q${F(x + r * .4)},${F(y)} ${F(x + r * .12)},${F(y - r * .25)} Q${F(x - r * .1)},${F(y - r * .3)} ${F(x - r * .1)},${F(y - r * .05)}" ` +
    `fill="none" stroke="${shade(c, -.32)}" stroke-width="${F(Math.max(1, r * .13))}" stroke-linecap="round"/>` +
    `<circle cx="${F(x - r * .35)}" cy="${F(y - r * .38)}" r="${F(r * .2)}" fill="#fff" opacity=".45"/>`;

  /** Pointed leaf with a centre vein, base at (x,y), pointing at angle a (degrees), length l. */
  const leaf = (x, y, l, a, c) => {
    const w = l * .36;
    return `<g transform="translate(${F(x)},${F(y)}) rotate(${F(a)})"><path d="M0,0 Q${F(l * .45)},${F(-w)} ${F(l)},0 Q${F(l * .45)},${F(w)} 0,0Z" fill="${H.grad(c)}" stroke="${ink(c)}" stroke-width="1.3" stroke-linejoin="round"/>` +
      `<path d="M${F(l * .12)},0 L${F(l * .78)},0" stroke="${shade(c, .35)}" stroke-width="1.1" stroke-linecap="round"/></g>`;
  };

  /** Butterfly seen from the front, centre (x,y), wing size r; c1 upper wings, c2 lower wings + spots. */
  const butterfly = (x, y, r, c1, c2) => {
    const wing = `<path d="M0,0 C${F(-r * .3)},${F(-r * 1.2)} ${F(-r * 1.35)},${F(-r * 1.2)} ${F(-r * 1.15)},${F(-r * .25)} C${F(-r * 1.05)},${F(r * .15)} ${F(-r * .4)},${F(r * .1)} 0,0Z" fill="${H.grad(c1, 'r')}" stroke="${ink(c1)}" stroke-width="1.2"/>` +
      `<path d="M0,0 C${F(-r * .9)},${F(r * .1)} ${F(-r * 1)},${F(r * .9)} ${F(-r * .45)},${F(r * .85)} C${F(-r * .15)},${F(r * .8)} ${F(-r * .05)},${F(r * .4)} 0,0Z" fill="${H.grad(c2, 'r')}" stroke="${ink(c1)}" stroke-width="1.2"/>` +
      `<circle cx="${F(-r * .7)}" cy="${F(-r * .5)}" r="${F(r * .2)}" fill="#fff" opacity=".8"/><circle cx="${F(-r * .45)}" cy="${F(r * .5)}" r="${F(r * .12)}" fill="#fff" opacity=".7"/>`;
    return `<g transform="translate(${F(x)},${F(y)})">${wing}<g transform="scale(-1,1)">${wing}</g>` +
      `<ellipse cx="0" cy="${F(r * .1)}" rx="${F(r * .14)}" ry="${F(r * .6)}" fill="#5b4157"/>` +
      `<path d="M0,${F(-r * .4)} q${F(-r * .2)},${F(-r * .5)} ${F(-r * .45)},${F(-r * .65)} M0,${F(-r * .4)} q${F(r * .2)},${F(-r * .5)} ${F(r * .45)},${F(-r * .65)}" stroke="#5b4157" stroke-width="1.2" fill="none" stroke-linecap="round"/></g>`;
  };

  /** Icelandic lupine spike: a tapering cone of small petal pairs standing up from (x,y), height h.
      All petals are one path with a gradient (colour at the bottom, paler at the tip) to keep markup small. */
  const lupine = (x, y, h, c) => {
    const gid = 'dr-lup-' + c.replace('#', '');
    const g = H.def(gid, `<linearGradient id="${gid}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="${shade(c, -.08)}"/><stop offset="1" stop-color="${mix(c, '#ffffff', .6)}"/></linearGradient>`);
    const n = Math.max(4, Math.round(h / 8));
    let d = '';
    for (let i = 0; i < n; i++) {
      const k = i / n, yy = y - h * .14 - i * (h * .84 / n), w = (1 - k) * h * .15 + 2.6, rx = w * .62, ry = w * .45;
      for (const cx of [x - w * .5, x + w * .5]) d += `M${F(cx - rx)},${F(yy)}a${F(rx)},${F(ry)} 0 1 0 ${F(2 * rx)},0a${F(rx)},${F(ry)} 0 1 0 ${F(-2 * rx)},0`;
    }
    return `<path d="M${F(x)},${F(y)} Q${F(x - 1.5)},${F(y - h * .5)} ${F(x)},${F(y - h)}" stroke="#4f8a45" stroke-width="2" fill="none"/>` +
      `<path d="${d}" fill="${g}" stroke="${ink(c)}" stroke-width=".8"/><circle cx="${F(x)}" cy="${F(y - h)}" r="2" fill="${mix(c, '#ffffff', .6)}"/>`;
  };
  /** Lupine's hand-shaped leaf: 7 narrow leaflets fanning out from (x,y). */
  const lupineLeaf = (x, y, r, c) => Array.from({ length: 7 }, (_, i) => {
    const a = 200 + i * 23.3, rad = a * Math.PI / 180, ex = x + Math.cos(rad) * r * .55, ey = y + Math.sin(rad) * r * .55;
    return `<ellipse cx="${F(ex)}" cy="${F(ey)}" rx="${F(r * .5)}" ry="${F(r * .14)}" transform="rotate(${F(a)} ${F(ex)} ${F(ey)})" fill="${c}" stroke="${ink(c)}" stroke-width=".8"/>`;
  }).join('');

  /** Scallop sea shell (fan with ribs), hinge at (x,y), opening upward. */
  const shell = (x, y, r, c) => {
    let ribs = '';
    for (let i = 1; i < 6; i++) { const a = (200 + i * 23.3) * Math.PI / 180; ribs += `M${F(x)},${F(y)}L${F(x + Math.cos(a) * r * .95)},${F(y + Math.sin(a) * r * .95)}`; }
    return `<path d="M${F(x)},${F(y)} L${F(x - r)},${F(y - r * .5)} Q${F(x - r * .9)},${F(y - r * 1.2)} ${F(x)},${F(y - r * 1.15)} Q${F(x + r * .9)},${F(y - r * 1.2)} ${F(x + r)},${F(y - r * .5)} Z" fill="${H.grad(c, 'r')}" stroke="${ink(c)}" stroke-width="1.3" stroke-linejoin="round"/>` +
      `<path d="${ribs}" stroke="${ink(c)}" stroke-width="1" opacity=".55"/>` +
      `<path d="M${F(x - r * .35)},${F(y + r * .1)} h${F(r * .7)} l${F(-r * .15)},${F(-r * .3)} h${F(-r * .4)}Z" fill="${shade(c, -.1)}" stroke="${ink(c)}" stroke-width="1"/>`;
  };
  /** Pearl: small white bead with a pearly radial gradient. */
  const pearlFill = () => H.def('dr-pearl', '<radialGradient id="dr-pearl" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#f3eef6"/><stop offset="1" stop-color="#cfc3d8"/></radialGradient>');
  const pearl = (x, y, r) => `<circle cx="${F(x)}" cy="${F(y)}" r="${F(r)}" fill="${pearlFill()}" stroke="#a99bb4" stroke-width=".9"/>`;
  /** Pearls along a quadratic curve a → (control c) → b, drawn as ONE dotted stroke (round dashes of length 0),
      a grey rim underneath and a small white highlight dot on each pearl. n = number of pearls. */
  const pearlString = (a, c, b, n, r) => {
    const len = (() => { let L = 0, p = a; for (let i = 1; i <= 20; i++) { const t = i / 20, u = 1 - t, q = [u * u * a[0] + 2 * u * t * c[0] + t * t * b[0], u * u * a[1] + 2 * u * t * c[1] + t * t * b[1]]; L += Math.hypot(q[0] - p[0], q[1] - p[1]); p = q; } return L; })();
    const gap = F(len / Math.max(1, n - 1)), d = `M${P(a)}Q${P(c)} ${P(b)}`;
    return `<path d="${d}" fill="none" stroke="#a99bb4" stroke-width="${F(2 * r + 1.6)}" stroke-dasharray="0 ${gap}" stroke-linecap="round"/>` +
      `<path d="${d}" fill="none" stroke="#f6f1f8" stroke-width="${F(2 * r)}" stroke-dasharray="0 ${gap}" stroke-linecap="round"/>` +
      `<path d="${d}" fill="none" stroke="#ffffff" stroke-width="${F(r * .8)}" stroke-dasharray="0 ${gap}" stroke-linecap="round" transform="translate(${F(-r * .3)},${F(-r * .35)})"/>`;
  };
  /** Starfish: five-armed star with dots. */
  const starfish = (x, y, r, c) => H.star(x, y, r, c).replace('/>', ` stroke="${ink(c)}" stroke-width="1.2" stroke-linejoin="round"/>`) +
    [0, 1, 2, 3, 4].map(i => { const a = (-90 + i * 72) * Math.PI / 180; return `<circle cx="${F(x + Math.cos(a) * r * .45)}" cy="${F(y + Math.sin(a) * r * .45)}" r="${F(r * .09)}" fill="#fff" opacity=".8"/>`; }).join('');

  /** Little standing puffin, feet at (x,y), scale s (1 ≈ 34 px tall), dir 1 = faces right, -1 = faces left. */
  const puffin = (x, y, s, dir = 1) =>
    `<g transform="translate(${F(x)},${F(y)}) scale(${F(s * dir)},${F(s)})">` +
    `<path d="M-3,-2 l-3,3 h5 M3,-2 l-1,3 h5" stroke="#ef7d2d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>` +
    `<path d="M-9,-6 C-13,-14 -11,-26 -3,-30 C5,-33 11,-27 10,-18 C10,-10 7,-4 0,-2 C-4,-1 -7,-3 -9,-6Z" fill="#2c2b3c" stroke="#1b1a26" stroke-width="1.2"/>` +
    `<path d="M1,-18 C8,-17 9,-7 2,-3 C-3,-5 -3,-15 1,-18Z" fill="#ffffff"/>` +
    `<ellipse cx="3.5" cy="-27" rx="5" ry="4.4" fill="#f1eee8"/>` +
    `<path d="M7,-31 C12,-31 15,-28 16,-25 C13,-23 10,-23 7,-24Z" fill="#ef7d2d" stroke="#b9531a" stroke-width="1"/><path d="M10,-30.5 v6" stroke="#f7c23a" stroke-width="1.4"/>` +
    `<circle cx="4.5" cy="-28" r="1.4" fill="#1b1a26"/><circle cx="2" cy="-24" r="1.6" fill="#f6a7a2" opacity=".8"/>` +
    `<path d="M-8,-20 Q-12,-12 -6,-6" stroke="#4a4960" stroke-width="1.6" fill="none" stroke-linecap="round"/></g>`;

  /** Sun: round disc with alternating long and short rays. */
  const sun = (x, y, r, c, c2) => {
    let rays = '';
    for (let i = 0; i < 12; i++) {
      const a = i * 30 * Math.PI / 180, l = i % 2 ? r * 1.45 : r * 1.75, a1 = a - .17, a2 = a + .17;
      rays += `M${F(x + Math.cos(a1) * r * .9)},${F(y + Math.sin(a1) * r * .9)}L${F(x + Math.cos(a) * l)},${F(y + Math.sin(a) * l)}L${F(x + Math.cos(a2) * r * .9)},${F(y + Math.sin(a2) * r * .9)}Z`;
    }
    return `<path d="${rays}" fill="${c2}" stroke="${ink(c2)}" stroke-width="1" stroke-linejoin="round"/>` +
      `<circle cx="${F(x)}" cy="${F(y)}" r="${F(r)}" fill="${H.grad(c, 'r')}" stroke="${ink(c2)}" stroke-width="1.3"/>` +
      `<circle cx="${F(x - r * .3)}" cy="${F(y - r * .3)}" r="${F(r * .28)}" fill="#fff" opacity=".6"/>`;
  };

  /** Unicorn horn: slim golden cone with spiral stripes, base at (x,y), height h. */
  const horn = (x, y, h, c) => {
    const w = h * .2;
    let stripes = '';
    for (let i = 1; i < 4; i++) { const k = i / 4, yy = y - h * k, ww = w * (1 - k); stripes += `M${F(x - ww)},${F(yy + h * .06)}L${F(x + ww)},${F(yy - h * .04)}`; }
    return `<path d="M${F(x - w)},${F(y)} L${F(x)},${F(y - h)} L${F(x + w)},${F(y)} Q${F(x)},${F(y + h * .1)} ${F(x - w)},${F(y)}Z" fill="${H.grad(c)}" stroke="${ink(c)}" stroke-width="1.2" stroke-linejoin="round"/>` +
      `<path d="${stripes}" stroke="${ink(c)}" stroke-width="1.1" stroke-linecap="round" opacity=".7"/>`;
  };

  /** Fluffy little cloud centred at (x,y), width ~2.6r. */
  const cloud = (x, y, r, c = '#ffffff', st = '#c9d6e8') =>
    `<path d="M${F(x - r * 1.3)},${F(y + r * .4)} a${F(r * .5)},${F(r * .5)} 0 0 1 ${F(r * .3)},${F(-r * .9)} a${F(r * .6)},${F(r * .6)} 0 0 1 ${F(r * 1)},${F(-r * .35)} a${F(r * .55)},${F(r * .55)} 0 0 1 ${F(r * .95)},${F(r * .45)} a${F(r * .45)},${F(r * .45)} 0 0 1 ${F(r * .05)},${F(r * .8)} Z" fill="${c}" stroke="${st}" stroke-width="1.3" stroke-linejoin="round"/>`;

  /** Holly leaf pair with three red berries. */
  const holly = (x, y, s, g = '#3f8a4f', b = '#d8263a') => {
    const lf = `<path d="M0,0 q4,-5 8,-3 q2,-4 7,-3 q1,-4 6,-3 q-2,5 2,9 q-6,1 -7,5 q-4,-3 -8,0 q-2,-4 -8,-5Z" fill="${H.grad(g)}" stroke="${ink(g)}" stroke-width="1.1" stroke-linejoin="round"/>`;
    return `<g transform="translate(${F(x)},${F(y)}) scale(${F(s)})"><g transform="rotate(-20)">${lf}</g><g transform="scale(-1,1) rotate(-20)">${lf}</g>` +

  /** Fur trim: two staggered rows of fluffy balls along y from x0 to x1. */
  const fur = (x0, x1, y, r, c = '#ffffff', st = '#cfc6cf') => {

    for (let row = 0; row < 2; row++) for (let i = 0; i <= n - row; i++) {

      s += `<circle cx="${F(x)}" cy="${F(y + (row ? r * .55 : -r * .3))}" r="${F(r)}" fill="${H.grad(c, 'r')}" stroke="${st}" stroke-width="1.1"/>`;

  /**

  function leotardPath(neck = 'scoop', neckDepth, pad = 2) {
    // short "boy-leg" cut so the doll's underwear never peeks out: legs end at y 508
    const bottom = 452, y = 508;
    const d = G.shirtPath({ sleeve: 0, pad, bottom, neck, neckDepth });
    const xo = G.legOutX(y) - pad - 1, xi = G.legInX(y) + 1;
    const legs = `L${F(G.torsoX(476) - pad)},476L${F(xo)},${y}Q${F((xo + xi) / 2)},${y + 4} ${F(xi)},${y}L200,${G.crotchY + 6}L${F(400 - xi)},${y}Q${F(200 + (200 - (xo + xi) / 2))},${y + 4} ${F(400 - xo)},${y}L${F(400 - G.torsoX(476) + pad)},476L`;
    return d.replace(`Q200,${bottom + 6} `, legs);
  }
  /** Leg-opening piping for leotardPath (both legs). */
  const leotardPiping = (pad = 2) => { const y = 508, xo = G.legOutX(y) - pad - 1, xi = G.legInX(y) + 1;
    return `M${F(xo)},${y}Q${F((xo + xi) / 2)},${y + 4} ${F(xi)},${y}M${F(400 - xo)},${y}Q${F(400 - (xo + xi) / 2)},${y + 4} ${F(400 - xi)},${y}`; };

/* =====================================================================
   Bottoms group: trousers, leggings, dungarees, shorts, skirts,
   snowsuits (kuldagallar) and rain bib trousers (pollabuxur).
   Same style as examples.js: fill → details → soft shading + tinted outline.
   Everything is computed for the LEFT side of the picture and mirrored
   with X() for the right side, so both legs always match.
   ===================================================================== */
(function () {
  'use strict';
  const { shade, ink, mix } = H;
  /** Safe id fragment from a colour. */
  const idOf = s => String(s).replace(/[^a-z0-9]/gi, '');
  const SW = G.stroke;

  /** Final pass for a shape: soft shading overlay plus the tinted outline (same as examples.js). */
  const outline = (d, base, soft = 'v') =>
    `<path d="${d}" fill="url(#soft-${soft})" stroke="${ink(base)}" stroke-width="${SW}" stroke-linejoin="round" stroke-linecap="round"/>`;

  /** Number formatting for path strings. */
  const n1 = v => (Math.round(v * 10) / 10).toString();
  const P = p => n1(p[0]) + ',' + n1(p[1]);
  /** Mirror x for side 'R'. */
  const XS = (side, x) => side === 'R' ? 400 - x : x;

  /** Dashed stitching line (jeans style). */
  const dash = (d, col, w = 1.5) => `<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-dasharray="3 2.5" stroke-linecap="round"/>`;

  /**
   * Edges of the LEFT trouser leg at height y, for a G.pantsPath with the same pad/flare/bottom.
   * Returns [outerX, innerX].
   */
  const legEdges = (y, pad, flare, bottom) => {
    const k = Math.max(0, (y - 476) / Math.max(1, bottom - 476));
    const out = (y <= 476 ? Math.min(G.torsoX(y), G.legOutX(y)) : G.legOutX(y)) - pad - flare * k;
    return [out, G.legInX(y) + pad + flare * k * .6];
  };

  /**
   * Trousers path like G.pantsPath, but safe for loose fits (big pad): the inner leg edge is
   * kept left of the centre line, with the gap between the legs opening softly below the
   * crotch, so the two legs never cross. crotchDrop lowers the crotch (snowsuits).
   * Returns { d, edges(y) } where edges(y) gives [outerX, innerX] of the left leg.
   */
  const trousers = ({ top = 398, bottom = 700, pad = 3, flare = 0, crotchDrop = 0 }) => {
    const crotch = G.crotchY + 2 + pad * .4 + crotchDrop;
    const k = y => Math.max(0, (y - 476) / Math.max(1, bottom - 476));
    // waist → hip: eased curve from the waist width out to the hip (no step at the waistband)
    const hipY = Math.max(top + 30, 446), x0 = G.torsoX(top), x1 = G.legOutX(hipY);
    const ease = t => 1 - Math.pow(1 - t, 2);
    const outer = y => (y <= hipY ? x0 + (x1 - x0) * ease(Math.max(0, (y - top) / (hipY - top))) : G.legOutX(Math.min(y, 702))) - pad - flare * k(y);
    // the inner edge may come no closer to the centre than this (0 at the crotch, growing below)
    const inner = y => Math.min(G.legInX(Math.min(y, 702)) + pad + flare * k(y) * .6, 200 - Math.min(1, (y - crotch) / 30) * 4 - .5);
    const ys = [];
    for (let y = top + 6; y < hipY; y += 6) ys.push(y);
    for (let y = hipY; y < bottom; y += 18) ys.push(y);
    ys.push(bottom);
    const outL = [[G.torsoX(top) - pad, top]].concat(ys.map(y => [outer(y), y]));
    const inL = ys.filter(y => y > crotch + 4).map(y => [inner(y), y]).reverse();
    const left = outL.concat(inL).concat([[200, crotch]]);
    const right = left.slice(0, -1).reverse().map(([x, y]) => [400 - x, y]);
    return { d: H.polyPath(left.concat(right)), edges: y => [outer(y), inner(y)], crotch };
  };

  /**
   * Several overlapping paths drawn as ONE garment: a double-width outline under everything,
   * then the fills on top, so the inner seams vanish and only the outer edge shows (at the
   * standard width). `fill` should be a page-space fill (see pageGrad) so no colour jump shows.
   */
  const merged = (paths, fill, base) =>
    paths.map(d => `<path d="${d}" fill="none" stroke="${ink(base)}" stroke-width="${SW * 2}" stroke-linejoin="round"/>`).join('') +
    paths.map(d => `<path d="${d}" fill="${fill}"/>`).join('');

  /** Clip path that is the UNION of several paths (one <path> per part, so windings never cancel). */
  const clipUnion = (id, paths) => H.def(id, `<clipPath id="${id}">${paths.map(d => `<path d="${d}"/>`).join('')}</clipPath>`);

  /** Vertical gradient in page space (same colour at the same height in every part of a piece). */
  const pageGrad = (hex, y0, y1) => {
    const id = 'bt-pg' + hex.replace('#', '') + y0 + '-' + y1;
    return H.def(id, `<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="0" y1="${y0}" x2="0" y2="${y1}"><stop offset="0" stop-color="${shade(hex, .12)}"/><stop offset="1" stop-color="${shade(hex, -.1)}"/></linearGradient>`);
  };

  /** Soft vertical rib / cord texture (many thin lines), meant to be clipped. */
  const ribs = (x0, x1, y0, y1, step, col, w, op) => {
    let d = '';
    for (let x = x0; x <= x1; x += step) d += `M${n1(x)},${y0}V${y1}`;
    return `<path d="${d}" stroke="${col}" stroke-width="${w}" opacity="${op}"/>`;
  };

  /** Waistband with elastic gathers between y0 and y1 (clip it to the garment). */
  const elasticBand = (y0, y1, col) =>
    `<rect x="0" y="${y0}" width="400" height="${y1 - y0}" fill="${H.grad(col)}"/>` +
    ribs(120, 280, y0 + 2, y1 - 2, 4, ink(col), 1, .3) +
    `<path d="M0,${y1}H400" stroke="${ink(col)}" stroke-width="1.6" opacity=".55"/>`;

  /**
   * Clip that hides a garment where the doll's hands are, so the hands look like they
   * hang IN FRONT of wide skirts, tutus and snowsuit legs (hands belong to the body layer,
   * which is drawn below every garment). Uses a copy of core.js's hand silhouette
   * (wrist at 0,0, all absolute commands; extended 30px up the forearm) moved by the same transform core uses:
   * translate(wrist x, wrist y - 2) rotate(±8.7°), mirrored for the right hand.
   */
  const HAND_D = 'M-12,-30 L-11.5,0 C-13,5 -14.5,11 -14.5,17 C-14.8,23 -13.5,28.5 -10.5,29.2 C-7.8,29.8 -7,27 -7,24 ' +
    'C-7.2,30 -6,34.5 -3.4,34.8 C-0.8,35.1 0,32 0,28.5 C0,34 1.4,37.6 3.8,37.6 C6.3,37.6 7,34.5 7,31 ' +
    'C7.3,34 8.6,35.2 10.6,34.7 C12.8,34.1 13.8,30.5 13.7,26.5 C13.6,24.5 14,23 15.2,22.2 ' +

      const sidePanel = side => {
        const pts = [], inner = [];
        for (let y = 412; y <= bottom + 4; y += 12) { const o = legEdges(Math.min(y, bottom), pad, 0, bottom)[0]; pts.push([XS(side, o - 2), y]); inner.push([XS(side, o + 10), y]); }

      };
      return `<path d="${d}" fill="${H.fill(it)}"/>` +
        `<g clip-path="${clip}">` + elasticBand(398, 412, shade(c, -.06)) +
          `<path d="${sidePanel('L')}${sidePanel('R')}" fill="${H.grad(panel)}"/>` +
          `<rect x="0" y="${bottom - 6}" width="400" height="8" fill="${shade(c, -.12)}"/>` +
          `<path d="M162,470 Q158,500 162,540 L169,540 Q165,500 169,470 Z M231,470 Q235,500 231,540 L238,540 Q242,500 238,470 Z" fill="#fff" opacity=".2"/>` +
        `</g>` +
        H.line('M190,472 l-9,8 M210,472 l9,8', c, 1.5, .4) +
        outline(d, c, 'h');
    },
  });

  /* =================================================================
     SKIRTS
     ================================================================= */
  const SKIRT_THUMB = [64, 384, 272, 236];

  /**
   * A-line skirt outline as one closed path (left side computed, right mirrored).
   * top waist y, bottom hem y, flare = hem spread beyond the hips, pad = looseness at the waist,
   * hem: 'curve' (soft round hem), 'scallop' (round petals/ruffle), 'zig' (tulle points);
   * step = width of one scallop/point, amp = its depth, shift = phase shift of the scallops (0..1).
   */
  const skirtShape = ({ top = 400, bottom = 540, flare = 30, pad = 4, hem = 'curve', step = 24, amp = 10, shift = 0 }) => {
    const wx = G.torsoX(top) - pad, hx = G.torsoX(Math.min(bottom, 476)) - pad - flare;
    const xl = y => wx + (hx - wx) * Math.pow((y - top) / (bottom - top), .72);
    const L = [];
    for (let y = top; y < bottom; y += 8) L.push([xl(y), y]);
    L.push([hx, bottom]);
    let d = 'M' + L.map(P).join('L');
    const x0 = hx, x1 = 400 - hx;
    if (hem === 'curve') d += `Q200,${bottom + 12} ${P([x1, bottom])}`;
    else {
      const n = Math.max(3, Math.round((x1 - x0) / step)), w = (x1 - x0) / n;
      // the hem bows down a little in the middle, like a real skirt seen from the front
      const yb = x => bottom + 8 * Math.sin(Math.PI * (x - x0) / (x1 - x0));
      if (shift) d += `L${P([x0 + w * shift, yb(x0 + w * shift)])}`;
      for (let k = 0; k < n; k++) {
        const a = x0 + w * (k + shift), b = Math.min(x1, a + w), m = (a + b) / 2;
        if (a >= x1) break;
        d += hem === 'zig' ? `L${P([m, yb(m) + (k % 2 ? amp * .7 : amp)])}L${P([b, yb(b)])}` : `Q${P([m, yb(m) + amp * 2])} ${P([b, yb(b)])}`;
      }
      d += `L${P([x1, bottom])}`;
    }
    d += 'L' + L.slice().reverse().map(([x, y]) => P([400 - x, y])).join('L') + 'Z';
    return { d, wx, hx, xl };
  };

  /** Waistband for skirts: a rounded band from the left waist edge to the right. */
  const skirtBand = (wx, top, h, col) => {
    const d = `M${n1(wx - 1)},${top - 2} H${n1(401 - wx)} L${n1(401 - wx - .5)},${top + h} H${n1(wx - .5)} Z`;
    return `<path d="${d}" fill="${H.grad(col)}"/>` + outline(d, col);
  };

  /* -------------------------------------------------------------
     Tutu: four layers of soft tulle with pointed hems, gathered at

     colors: [tulle, deeper tulle, waistband, sparkle]
     ------------------------------------------------------------- */
  DOLL.shape('tutu', {

        skirtShape({ top, bottom: 512, flare: 56, pad: 6, hem: 'zig', step: 17, amp: 13 }),
        skirtShape({ top, bottom: 500, flare: 50, pad: 6, hem: 'zig', step: 16, amp: 12, shift: .5 }),
        skirtShape({ top, bottom: 488, flare: 42, pad: 6, hem: 'zig', step: 18, amp: 11 }),

      /** Fine tulle gathers: lines fanning out from the waist to the hem, clipped to a layer. */

      out += skirtBand(wx, top - 2, 12, band) +
        `<path d="M${n1(wx + 4)},${top + 1}H${n1(396 - wx)}" stroke="#fff" stroke-width="2" opacity=".5" stroke-linecap="round"/>` +
        `<path d="M200,406 l-14,-8 q-4,8 0,16 Z M200,406 l14,-8 q4,8 0,16 Z M197,408 l-6,16 l5,-2 l3,4 Z M203,408 l6,16 l-5,-2 l-3,4 Z" fill="${H.grad(band)}" stroke="${ink(band)}" stroke-width="1.5" stroke-linejoin="round"/>` +
        `<circle cx="200" cy="406" r="3.6" fill="${shade(band, .25)}" stroke="${ink(band)}" stroke-width="1.3"/>`;
      return handsFront(out);

          `<circle cx="245" cy="${bottom - 55}" r="3.6" fill="#f2c34d" stroke="#a87a1e" stroke-width="1.2"/>` + H.heart(251, bottom - 33, 4, '#e8475a');

/* =====================================================================
   Footwear, mittens, scarves and bags.
   Same style as examples.js: fill → details → soft shading → tinted outline.
   Left/right: every pair piece is drawn ONCE in left-side coordinates and
   the right side is the same markup inside a mirror group (x → 400 - x),
   so offsets and directions can never get out of step between the sides.
   ===================================================================== */
(function () {
  'use strict';
  const { shade, ink } = H;
  const SW = G.stroke;
  const SKIN = PALETTE.SKIN;

  /** Final pass for a shape: soft shading overlay plus the tinted outline. */
  const outline = (d, base, soft = 'v', sw = SW) =>
    `<path d="${d}" fill="url(#soft-${soft})" stroke="${ink(base)}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"/>`;

  /** Mirror markup drawn on the left side over to the right side (x → 400 - x). */
  const mirror = m => `<g transform="matrix(-1,0,0,1,400,0)">${m}</g>`;
  /** Left piece plus its mirrored right piece. */
  const pair = fn => fn() + mirror(fn());

  const P = p => p[0].toFixed(1) + ',' + p[1].toFixed(1);
  /** Register a vertical gradient with [offset, colour] stops. Returns url(#id). */
  const addGrad = (id, stops, h) => H.def(id, `<linearGradient id="${id}" x1="0" y1="0" x2="${h ? 1 : 0}" y2="${h ? 0 : 1}">${stops.map(([o, c]) => `<stop offset="${o}" stop-color="${c}"/>`).join('')}</linearGradient>`);
  /** Small four-point twinkle star. */
  const twinkle = (x, y, r, c = '#fff') => `<path d="M${x},${y - r}Q${x},${y} ${x + r},${y}Q${x},${y} ${x},${y + r}Q${x},${y} ${x - r},${y}Q${x},${y} ${x},${y - r}Z" fill="${c}"/>`;
  /** Round gem with a light glint. */
  const gem = (x, y, r, c) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${H.grad(c, 'r')}" stroke="${ink(c)}" stroke-width="1.3"/>` +
    `<circle cx="${(x - r * .35).toFixed(1)}" cy="${(y - r * .35).toFixed(1)}" r="${(r * .32).toFixed(1)}" fill="#fff" opacity=".9"/>`;
  /** Stroke drawn twice (ink underneath, colour on top) so a strap or cord gets an outline. */
  const strap = (d, c, w) => `<path d="${d}" fill="none" stroke="${ink(c)}" stroke-width="${w + 2.6}" stroke-linecap="round" stroke-linejoin="round"/>` +
    `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;

  // Left foot centre (the right foot is the mirror).
  const [FX, FY] = G.feet[0];

  /** Sole band at the bottom of a shoe outline: clipped to the shoe so it follows its curve. */
  const sole = (id, foot, y0, c, h = 30) =>
    `<g clip-path="${H.clip(id, foot)}"><rect x="${FX - 60}" y="${y0}" width="120" height="${h}" fill="${c}"/>` +
    `<path d="M${FX - 60},${y0} H${FX + 60}" stroke="${ink(c)}" stroke-width="1.6" opacity=".7"/></g>`;

  /**
   * Boot shaft for the left leg from `top` down to just above the sole (like the
   * approved rainboots): built from G.legOutX / G.legInX so it always fits the leg.
   * Returns the closed shaft path, the two side edges (outline only on the sides,
   * so there is no seam line where the shaft meets the foot) and the edge points.
   */
  function shaft(top, low = 716, pad = 6, flare = 3) {
    const k = y => (y - top) / (low - top), outer = [], inner = [];
    const step = (low - top) / Math.max(4, Math.round((low - top) / 13));
    for (let y = top; y <= low + .1; y += step) {
      outer.push([G.legOutX(y) - pad - flare * k(y), y]);
      inner.push([G.legInX(y) + pad + flare * k(y) * .6, y]);
    }
    return {
      outer, inner,
      d: H.polyPath(outer.concat(inner.slice().reverse())),
      edges: 'M' + outer.map(P).join('L') + 'M' + inner.map(P).join('L'),
    };
  }
  /** x of the outer / inner shaft edge at height y (left side). */
  const shaftX = (top, low, pad, flare, y, inner) => {
    const k = (y - top) / (low - top);
    return inner ? G.legInX(y) + pad + flare * k * .6 : G.legOutX(y) - pad - flare * k;
  };

  /* =================================================================
     SHOES  (slot shoes, cat shoes)
     ================================================================= */

  /* -------------------------------------------------------------
     Sneakers with laces, a rubber toe cap, a side stripe and a thick sole.
     colors: [upper, sole/toe cap, accent (collar + stripe), laces]
     it.light = true → light-up sole: rainbow sole with glowing little lights.
     ------------------------------------------------------------- */
  DOLL.shape('feet-sneaker', {
    slot: 'shoes',
    draw(it) {

      const foot = G.footPath('L', 4, 3);

      const soleFill = it.light ? addGrad('fs-light-' + it.id, [[0, '#ff7aa8'], [.25, '#ffd45e'], [.5, '#7be08f'], [.75, '#6cc6ff'], [1, '#b68cff']], true) : soleC;
      const lights = it.light ? [146, 157, 168, 179].map((x, i) => {
        const y = FY + 12 + (i === 0 ? -1 : 0);
        return `<circle cx="${x}" cy="${y}" r="4.6" fill="#fff" opacity=".45"/><circle cx="${x}" cy="${y}" r="2" fill="#fff"/>`;

    `<circle cx="2" cy="-15" r="1.1" fill="#26222c"/><path d="M2,-13.8 l1.4,1.6" stroke="#26222c" stroke-width=".6"/>` +

    `<path d="M5,-17 L6.6,-16.6 L6.6,-11.1 L5,-11 Z" fill="#8a8f98"/>` +
    `<path d="M7.8,-16 Q8.6,-14 7.8,-11.2" stroke="#f7d14a" stroke-width="1.1" fill="none"/></g>`;
  DOLL.shape('feet-wellies', {
    slot: 'shoes',

          `<path d="M120,690 q6,-6 12,0 t12,0 t12,0 t12,0 t12,0 t12,0" fill="none" stroke="#fff" stroke-width="2.2"/>` +
          `</g>` + puffin(166, 689, 1.25) + puffin(168, 650, 1.05);
      } else if (it.motif === 'frog') {

        const eye = (x, y) => `<circle cx="${x}" cy="${y}" r="6" fill="${H.grad(c, 'r')}" stroke="${ink(c)}" stroke-width="1.8"/>` +
          `<circle cx="${x}" cy="${y}" r="3.8" fill="#fff"/><circle cx="${x - .6}" cy="${y + .4}" r="2.2" fill="#2b2733"/><circle cx="${x - 1.2}" cy="${y - .6}" r=".8" fill="#fff"/>`;
        toes = eye(145, 712) + eye(158, 708) +

        motif = [[166, 640, 4], [178, 668, 3], [160, 690, 3.5], [170, 650, 2]].map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${shade(c, -.18)}" opacity=".6"/>`).join('');
      }
      const one = () =>
        `<path d="${foot}" fill="${H.fill(it)}"/>` + sole('c-' + it.id, foot, FY + 8, soleC, 30) + outline(foot, c, 'r') +
        `<path d="${sh.d}" fill="${H.fill(it)}"/>` + motif + `<path d="${sh.d}" fill="url(#soft-h)"/>` +
        `<path d="${sh.edges}" fill="none" stroke="${ink(c)}" stroke-width="${SW}" stroke-linecap="round"/>` +
        `<path d="${rimD}" fill="${H.grad(rim)}" stroke="${ink(c)}" stroke-width="2" stroke-linejoin="round"/>` +
        `<path d="M158,630 Q155,650 157,668" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".55" fill="none"/>` +

  /* -------------------------------------------------------------
     Felt boots: soft felt boots with a folded cuff, embroidered flowers and pompom ties.
     colors: [felt, cuff, flower, pompom]
     ------------------------------------------------------------- */
  DOLL.shape('feet-felt', {
    slot: 'shoes',
    thumb: BOOT_THUMB,
    draw(it) {
      const [c, cuffC = shade(c, .4), flo = '#e2505b', pom = '#f6c636'] = it.colors;
      const top = 626, sh = shaft(top, 716, 8, 2);
      const foot = G.footPath('L', 7, 3);
      const cy = top + 14;
      const ca = shaftX(top, 716, 8, 2, cy, false) - 2, cb = shaftX(top, 716, 8, 2, cy, true) + 2;
      const [o0, i0] = [sh.outer[0], sh.inner[0]];
      const cuff = `M${o0[0] - 3},${top - 2} Q${(o0[0] + i0[0]) / 2},${top + 3} ${i0[0] + 3},${top - 2} L${cb},${cy} Q${(ca + cb) / 2},${cy + 6} ${ca},${cy} Z`;
      // embroidered vine: two flowers and leaves
      const leaf = (x, y, r) => `<ellipse cx="${x}" cy="${y}" rx="4.5" ry="2" transform="rotate(${r} ${x} ${y})" fill="#6dbb6a"/>`;
      const embro = H.line('M170,700 Q166,684 171,668', '#6dbb6a', 1.6, .9) + leaf(165, 690, -40) + leaf(176, 678, 30) +
        H.flower(171, 666, 7, flo) + H.flower(166, 698, 5.5, shade(flo, .35)) +
        `<path d="M146,722 l3,-3 l3,3 l3,-3 l3,3" fill="none" stroke="${cuffC}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>`;
      const poms = `<path d="M${ca + 4},${cy - 2} q-3,8 -6,14 M${ca + 4},${cy - 2} q1,9 3,15" stroke="${ink(cuffC)}" stroke-width="1.4" fill="none"/>` +
        gem(ca - 2, cy + 13, 4, pom) + gem(ca + 7, cy + 14, 4, pom);
      const one = () =>
        `<path d="${foot}" fill="${H.pat('knit', c, shade(c, -.12), 8)}"/>` + sole('c-' + it.id, foot, FY + 12, shade(c, -.4), 20) + outline(foot, c, 'r') +
        `<path d="${sh.d}" fill="${H.pat('knit', c, shade(c, -.12), 8)}"/><path d="${sh.d}" fill="url(#soft-h)"/>` +
        embro +
        `<path d="${sh.edges}" fill="none" stroke="${ink(c)}" stroke-width="${SW}" stroke-linecap="round"/>` +
        `<path d="${cuff}" fill="${H.grad(cuffC)}" stroke="${ink(cuffC)}" stroke-width="2" stroke-linejoin="round"/>` +
        `<path d="M${o0[0] + 2},${top + 6} Q${(o0[0] + i0[0]) / 2},${top + 10} ${i0[0] - 2},${top + 6}" stroke="${flo}" stroke-width="1.6" stroke-dasharray="2 3" fill="none"/>` +

  /* =================================================================
     MITTENS  (slot mittens, cat mittens)
     Drawn in the same local space as the doll's hand in core.js:
     wrist at (0,0), fingers pointing down (+y), body side = +x.
     The group is then moved to the wrist and tilted 8.7° with the forearm;
     the right mitten is the same markup with scale(-1,1), exactly like the hand.
     ================================================================= */

  /**
   * Mitten silhouette in local hand space. The thumb is part of the one outline:
   * it leaves the body-side edge just below the wrist, angles down and out,
   * ends in a round tip and turns back into a small notch against the mitten.
   */
  const MITT = 'M-15.5,-3 C-17.5,9 -18.5,22 -16.5,32 C-14.5,42 -6,47.5 1,47 C8.5,46.5 13.5,41 13.8,32.5 ' +
    'C14,30 14,28.5 14.2,27.5 C16,30.5 19.5,32 22,30.5 C24.8,28.8 25,24 23.4,18.5 C21.6,12 18.5,6 16.4,-3 Z';
  /** Line where the thumb meets the hand (a soft fold, drawn inside the shape). */
  const MITT_FOLD = 'M14.2,27.5 C13.8,22 14.5,16 16.5,10';
  /** Ribbed cuff over the wrist (and over the end of a sleeve). */
  const CUFF = 'M-18,-16 Q0,-19 18,-16 L18.5,-1 Q0,2 -18.5,-1 Z';

  /** Place local-space mitten markup on the left or right hand (same transform as the hand). */
  const onHand = (side, m) => {
    const [wx, wy] = G.armPoint(side, 1);
    const tilt = side === 'L' ? 8.7 : -8.7, flip = side === 'L' ? '' : ' scale(-1,1)';
    return `<g transform="translate(${wx.toFixed(1)},${(wy - 2).toFixed(1)}) rotate(${tilt})${flip}">${m}</g>`;
  };

  /** Eight-petal rose (áttablaðarós), the classic Icelandic knitting star. */
  const rose = (cx, cy, r, c) => {
    let d = '';
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4, a1 = a - .32, a2 = a + .32;
      d += `M${cx},${cy}L${(cx + Math.cos(a1) * r * .62).toFixed(1)},${(cy + Math.sin(a1) * r * .62).toFixed(1)}L${(cx + Math.cos(a) * r).toFixed(1)},${(cy + Math.sin(a) * r).toFixed(1)}L${(cx + Math.cos(a2) * r * .62).toFixed(1)},${(cy + Math.sin(a2) * r * .62).toFixed(1)}Z`;
    }
    return `<path d="${d}" fill="${c}"/>`;
  };

  /* -------------------------------------------------------------
     Mittens. it.style picks the design:
       'knit'   knitted mittens with a ribbed cuff and a motif (it.motif 'heart' | 'star' | none)
       'lopi'   Icelandic pattern: zigzag band, eight-petal rose, dotted rows
       'snow'   snowflake mittens
       'ski'    waterproof ski mittens: glossy shell, long gauntlet cuff with a toggle, grip patch
       'fluffy' furry mittens with a scalloped fluffy outline and pompom ties
     it.string = true → a cord runs from each cuff up the inside of the arm (mittens on a string).
     colors: [main, cuff/second, motif, extra]
     ------------------------------------------------------------- */
  DOLL.shape('mitt', {
    slot: 'mittens',
    thumb: [58, 408, 84, 84],
    draw(it) {
      const [c, c2 = shade(c, -.2), mot = '#ffffff', c4 = '#ffffff'] = it.colors;
      const st = it.style || 'knit';
      const knit = H.pat('knit', c, shade(c, -.28), 7);
      const clip = H.clip('c-' + it.id, MITT);
      const ribs = (x0, x1, y0, y1, col) => H.line(Array.from({ length: Math.round((x1 - x0) / 3.6) + 1 }, (_, i) => `M${(x0 + i * 3.6).toFixed(1)},${y0}V${y1}`).join(''), col, 1, .45);
      let body = '', cuff = '';
      if (st === 'ski') {
        // glossy shell with a grip patch at the fingertips and a reflective stripe
        body = `<path d="${MITT}" fill="${H.grad(c, 'h')}"/>` +
          `<g clip-path="${clip}"><path d="M-30,34 Q0,30 30,28 V60 H-30 Z" fill="${c2}"/>` +
          `<path d="M-30,10 L30,6 V11 L-30,15 Z" fill="${c4}" opacity=".9"/></g>` +
          H.line(MITT_FOLD, c, 1.6, .6) + outline(MITT, c, 'h') +
          `<path d="M-11,2 Q-14,14 -12,26" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" opacity=".6"/>`;
        // long gauntlet cuff that flares over the sleeve, with a cord stopper
        const g = 'M-20,-26 Q0,-29 20,-26 L18,-1 Q0,2 -18,-1 Z';
        cuff = `<path d="${g}" fill="${H.grad(c2)}"/>` + `<path d="M-20,-26 Q0,-29 20,-26 L19.6,-22 Q0,-25 -19.6,-22 Z" fill="${shade(c2, -.25)}"/>` +
          outline(g, c2) +
          `<path d="M-17,-8 Q0,-5 17,-8" stroke="${mot}" stroke-width="3.2" fill="none" stroke-linecap="round"/>` +
          `<path d="M6,-22 q2,6 1,10" stroke="${ink(c2)}" stroke-width="1.2" fill="none"/>` +
          `<rect x="3.5" y="-13" width="7" height="8" rx="3" fill="${H.grad(mot)}" stroke="${ink(mot)}" stroke-width="1.2"/>`;
      } else if (st === 'fluffy') {
        // fur: small puffs all along the outline, then the soft body on top
        const pts = [[-16, 0], [-17.5, 8], [-18, 16], [-17.5, 24], [-16.5, 32], [-13, 40], [-7, 45], [0, 47], [7, 45.5], [12.5, 40], [14, 32], [18, 31.5], [23, 28], [24, 21], [22, 13], [19.5, 6], [17, 0]];
        body = pts.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="4.6" fill="${c}" stroke="${ink(c)}" stroke-width="1.3"/>`).join('') +
          `<path d="${MITT}" fill="${H.grad(c, 'r')}"/>` + `<path d="${MITT}" fill="url(#soft-r)"/>` +
          H.line(MITT_FOLD, c, 1.4, .5) +
          // fur tufts
          H.line('M-12,6 q2,-3 4,0 M-13,34 q2,-3 4,0 M4,40 q2,-3 4,0 M16,14 q2,-3 4,0', c, 1.2, .5) +
          H.heart(-2, 24, 7, mot);
        cuff = `<path d="${CUFF}" fill="${H.grad(c2)}"/>` +
          [-15, -7.5, 0, 7.5, 15].map(x => `<circle cx="${x}" cy="-9" r="5.6" fill="${H.grad(c2, 'r')}" stroke="${ink(c2)}" stroke-width="1.2"/>`).join('') +
          // pompom ties hanging from the cuff
          `<path d="M-12,-4 q-2,6 -4,10 M-12,-4 q2,7 2,11" stroke="${ink(c4)}" stroke-width="1.2" fill="none"/>` +
          gem(-16, 7, 3.6, c4) + gem(-10, 8.5, 3.6, c4);
      } else {
        let motif = '';
        if (st === 'lopi') {
          // zigzag band and dot rows around the rose
          let zig = 'M-30,6';
          for (let x = -30; x < 30; x += 6) zig += 'l3,4l3,-4';
          motif = `<path d="${zig}" fill="none" stroke="${c2}" stroke-width="2.4" stroke-linejoin="round"/>` +
            `<rect x="-30" y="12.5" width="60" height="2.2" fill="${c2}"/>` +
            rose(-1.5, 26, 9, c2) + `<circle cx="-1.5" cy="26" r="2" fill="${mot}"/>` +
            [-11, 8].map(x => `<circle cx="${x}" cy="26" r="1.8" fill="${mot}"/>`).join('') +
            Array.from({ length: 9 }, (_, i) => `<circle cx="${-14 + i * 3.6}" cy="39" r="1.3" fill="${c2}"/>`).join('');
        } else if (st === 'snow') {
          motif = H.flake(-1.5, 24, 10, mot) + `<circle cx="-1.5" cy="24" r="2.4" fill="${c4}"/>` +
            H.flake(-11, 8, 3.5, mot) + H.flake(8, 40, 3.5, mot) + H.flake(19, 22, 2.8, mot);
        } else if (it.motif === 'heart') {
          motif = H.heart(-1.5, 23, 9, mot) + `<path d="M-6,19 q2,-3 4,-2" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".7"/>`;
        } else if (it.motif === 'star') {
          motif = H.star(-1.5, 24, 10, mot);
        }
        body = `<path d="${MITT}" fill="${knit}"/>` + `<g clip-path="${clip}">${motif}</g>` +
          H.line(MITT_FOLD, c, 1.6, .6) + outline(MITT, c, 'h');
        cuff = `<path d="${CUFF}" fill="${H.grad(c2)}"/>` + ribs(-16, 16, -15, -1, c2) + outline(CUFF, c2) +
          (st === 'lopi' ? `<path d="M-17,-8.5 Q0,-11 17,-8.5" stroke="${mot}" stroke-width="2.2" stroke-dasharray="1.5 3" stroke-linecap="round" fill="none"/>` : '');
      }
      const one = side => onHand(side, body + cuff);
      // mittens on a string: a cord from the inner cuff up the inside of the arm into the sleeve/armpit
      let cord = '';
      if (it.string) {
        const d = 'M112,432 C122,404 130,376 138,348 C142,334 146,322 149,314';
        cord = pair(() => `<path d="${d}" fill="none" stroke="${ink(c4)}" stroke-width="4.4" stroke-linecap="round"/>` +
          `<path d="${d}" fill="none" stroke="${c4}" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="3 2"/>`);
      }
      return cord + one('L') + one('R');
    },
  });

  /* =================================================================
     SCARVES  (slot scarf, cat scarf)
     A thick wrap sits round the neck just under the chin (neck x 186–214),
     resting on the shoulders; tails hang down the front.
     ================================================================= */
  // the wrap round the neck: top edge tucks under the chin, bottom rests on the collarbones
  const WRAP = 'M171,250 C170,238 178,232 186,233 Q200,242 214,233 C222,232 230,238 229,250 C229,266 216,276 200,276 C184,276 171,266 171,250 Z';
  // a second, lower roll so the wrap looks wound round twice
  const WRAP2 = 'M168,262 C170,256 178,258 188,264 Q200,270 212,264 C222,258 230,256 232,262 C233,276 218,288 200,288 C182,288 167,276 168,262 Z';
  /** One hanging tail: from the knot (x0,y0) down to the end (x1,y1), width w, with a soft wave. */
  const tailD = (x0, y0, x1, y1, w) => {
    const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
    return `M${x0 - w / 2},${y0} Q${mx - w / 2 - 4},${my} ${x1 - w / 2},${y1} L${x1 + w / 2},${y1 + 3} Q${mx + w / 2 - 4},${my} ${x0 + w / 2},${y0} Z`;
  };

  /* -------------------------------------------------------------
     Knitted scarf. it.tails 1 or 2; it.fringe = fringe at the ends;
     it.stripes = colours of the stripes across the tails and along the wrap;
     it.lopi = Icelandic pattern band near the ends;
     it.puffin = the long tail ends in a puffin head.
     colors: [main, second (cuff/stripe), motif]
     ------------------------------------------------------------- */
  DOLL.shape('scarf-knit', {
    slot: 'scarf',
    thumb: [134, 214, 132, 218],
    draw(it) {
      const [c, c2 = shade(c, -.2), mot = '#ffffff'] = it.colors;
      const knit = H.pat('knit', c, shade(c, -.25), 8);
      const tails = it.tails || 2;
      // tail ends: front tail from under the knot to y 396, the second one shorter and to the side
      const T1 = { x0: 184, y0: 268, x1: 176, y1: 396, w: 24 };
      const T2 = { x0: 202, y0: 270, x1: 210, y1: 360, w: 22 };
      const tl = t => tailD(t.x0, t.y0, t.x1, t.y1, t.w);
      /** Decorations clipped inside one tail: stripes, lopi band, fringe. */
      const deco = (t, k) => {
        const d = tl(t), cl = H.clip(`c-${it.id}-t${k}`, d);
        let g = '';
        if (it.stripes) g += it.stripes.map((sc, i) => `<rect x="120" y="${t.y1 - 16 - i * 14}" width="160" height="7" fill="${sc}"/>`).join('') +
          it.stripes.map((sc, i) => `<rect x="120" y="${t.y0 + 18 + i * 14}" width="160" height="7" fill="${sc}"/>`).join('');
        if (it.lopi) {
          const y = t.y1 - 30;
          let zig = `M120,${y}`;
          for (let x = 120; x < 280; x += 6) zig += 'l3,4l3,-4';
          g += `<rect x="120" y="${y - 6}" width="160" height="2.4" fill="${c2}"/>` + `<path d="${zig}" fill="none" stroke="${c2}" stroke-width="2.2"/>` +
            `<rect x="120" y="${y + 7}" width="160" height="2.4" fill="${c2}"/>` +
            rose(t.x1 + 1, y - 22, 8, c2) + `<circle cx="${t.x1 + 1}" cy="${y - 22}" r="1.8" fill="${mot}"/>`;
        }
        return `<path d="${d}" fill="${knit}"/><g clip-path="${cl}">${g}</g>` + outline(d, c, 'h');
      };
      /** Fringe at a tail end. */
      const fringe = t => {
        if (!it.fringe) return '';
        let d = '';
        for (let i = 0; i <= 6; i++) { const x = t.x1 - t.w / 2 + 2 + i * (t.w - 4) / 6, y = t.y1 + 1 + i * 3 / 6; d += `M${x.toFixed(1)},${y.toFixed(1)}q${i % 2 ? 1 : -1},6 0,12`; }
        return `<path d="${d}" fill="none" stroke="${ink(c2)}" stroke-width="3.6" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${c2}" stroke-width="2" stroke-linecap="round"/>`;
      };
      /** Puffin head at the end of the front tail (a black head with white face, orange beak). */
      const puffinEnd = t => {
        const x = t.x1 + 1, y = t.y1 + 6;
        return `<ellipse cx="${x}" cy="${y}" rx="17" ry="15" fill="${H.grad('#2b2733', 'r')}" stroke="#18151c" stroke-width="2"/>` +
          `<ellipse cx="${x}" cy="${y + 3}" rx="12" ry="10" fill="#fbf8f2"/>` +
          `<circle cx="${x - 5}" cy="${y}" r="2.4" fill="#2b2733"/><circle cx="${x + 5}" cy="${y}" r="2.4" fill="#2b2733"/>` +
          `<circle cx="${x - 4.3}" cy="${y - .7}" r=".8" fill="#fff"/><circle cx="${x + 5.7}" cy="${y - .7}" r=".8" fill="#fff"/>` +
          `<path d="M${x - 6},${y - 3} l-3,-1.5 M${x + 6},${y - 3} l3,-1.5" stroke="#2b2733" stroke-width="1"/>` +
          // big triangular beak pointing down with a yellow stripe
          `<path d="M${x - 6},${y + 3} Q${x},${y + 1} ${x + 6},${y + 3} Q${x + 3},${y + 13} ${x},${y + 16} Q${x - 3},${y + 13} ${x - 6},${y + 3} Z" fill="#f05a28" stroke="#9a3a1a" stroke-width="1.2" stroke-linejoin="round"/>` +
          `<path d="M${x - 4.5},${y + 7} Q${x},${y + 5.5} ${x + 4.5},${y + 7}" stroke="#f7d14a" stroke-width="1.6" fill="none"/>` +
          `<path d="M${x - 5},${y + 3.4} Q${x},${y + 1.5} ${x + 5},${y + 3.4}" stroke="#8a8f98" stroke-width="1.6" fill="none"/>` +
          `<circle cx="${x - 9}" cy="${y + 7}" r="2.6" fill="#f48ca0" opacity=".55"/><circle cx="${x + 9}" cy="${y + 7}" r="2.6" fill="#f48ca0" opacity=".55"/>`;
      };
      /** The wrap (two rolls) with its pattern and soft ribbing. */
      const wrap = d => {
        const cl = H.clip(`c-${it.id}-w${d === WRAP ? 1 : 2}`, d);
        const st = it.stripes ? it.stripes.map((sc, i) => `<rect x="${168 + i * 22}" y="226" width="7" height="70" fill="${sc}"/>`).join('') : '';
        const lp = it.lopi ? Array.from({ length: 10 }, (_, i) => H.diamond(172 + i * 6.4, d === WRAP ? 258 : 276, 3, c2)).join('') : '';
        return `<path d="${d}" fill="${knit}"/><g clip-path="${cl}">${st}${lp}</g>` + outline(d, c, 'v');
      };
      let out = '';
      if (tails === 2) out += deco(T2, 2) + fringe(T2);
      out += wrap(WRAP2) + wrap(WRAP);
      out += deco(T1, 1) + (it.puffin ? puffinEnd(T1) : fringe(T1));
      // knot where the tails come out of the wrap
      const knot = 'M178,262 C180,254 196,252 200,262 C202,272 196,280 188,280 C180,280 176,272 178,262 Z';
      out += `<path d="${knot}" fill="${knit}"/>` + outline(knot, c, 'r') + H.line('M184,262 q2,8 0,14 M192,261 q2,9 -1,16', c, 1.4, .5);
      return out;
    },
  });

  /* -------------------------------------------------------------
     Snood: a chunky knitted tube round the neck (no tails), with cable ribs

        <rect x="-14" y="2" width="28" height="38" rx="4" fill="#5e3b26"/>
        <circle cx="0" cy="-28" r="40" fill="url(#winglow)" class="glow"/><rect x="-11" y="-38" width="22" height="20" rx="3" fill="#ffd36b" stroke="#5e3b26" stroke-width="3"/>
